# kjdmud config: boots the bundled mudlib (mudlib/, "Library"). See
# INSTALL.md to build, run, and connect.
mud_name: Library
mudlib_root: mudlib
master_file: /single/master
simul_efun_file: /single/simul_efun
include_dir: include
global_include_file: <config.h>
heartbeat_interval_ms: 2000
max_eval_cost: 10000000

# Listen table. Even ports from 1122 upward. port: stays the telnet
# default for anything that still reads Config::port() alone.
# 1122 telnet (Mudlet / tin / nc)
# 1124 websocket (mudlib/www/client.html)
# 1126 telnet + TLS
# 1128 websocket + TLS (wss)
# 1130+ reserved, not bound yet
port: 1122
listen: telnet 1122
listen: websocket 1124
listen: telnet 1126 tls
listen: websocket 1128 tls

# Optional. Generate with etc/make-dev-certs.sh. TLS ports are skipped
# (plain 1122/1124 still bind) if these files are missing.
tls_cert: etc/dev-cert.pem
tls_key: etc/dev-key.pem
