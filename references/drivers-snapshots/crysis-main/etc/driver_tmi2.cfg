# amlp config -- boots the real, vendored third-party "TMI-2" mudlib
# (temp/tmi2_fluffos_v3_extracted/tmi2_fluffos_v3/lib, a real classic
# LPmud lib -- The Mud Institute II, one of the two mudlibs row 3.8
# names explicitly -- gitignored the same way temp/reference-lpc-mud-
# library already is, see CLAUDE.md). Values taken directly from that
# mudlib's own real bundled bin/config.tmi2 (a real driver-config
# template it ships: "mudlib directory : /mud/tmi2/lib", "master file :
# /adm/obj/master", "simulated efun file : /adm/obj/simul_efun",
# "include directories : /include", "global include file : <mudlib.h>"),
# not guessed, same derivation discipline as etc/driver_aethermud.cfg.
mud_name: TMI2
mudlib_root: temp/tmi2_fluffos_v3_extracted/tmi2_fluffos_v3/lib
master_file: /adm/obj/master
simul_efun_file: /adm/obj/simul_efun
include_dir: include
global_include_file: <mudlib.h>
dialect: fluffos
port: 4201
heartbeat_interval_ms: 2000
max_eval_cost: 10000000
