# amlp config -- boots the real, vendored third-party "Dead Souls 3.8.2"
# mudlib (temp/ds3.8.2_extracted/ds3.8.2/lib, a real, heavily-documented
# FluffOS mudlib, the user's own explicit pick for the next real-world
# boot after TMI-2, see docs/dev/STATUS.md's own 2026-09-03 (further
# session) entry -- gitignored the same way every other temp/ mudlib
# corpus already is, see CLAUDE.md). Values taken directly from that
# mudlib's own real bundled bin/mudos.cfg ("mudlib directory : ../lib",
# "master file : /secure/daemon/master", "simulated efun file :
# /secure/sefun/sefun", "include directories : /secure/include:/include",
# "global include file : <global.h>", "maximum evaluation cost :
# 5000000", "maximum string length : 200000"), not guessed, same
# derivation discipline as etc/driver_tmi2.cfg/etc/driver_aethermud.cfg.
# Two include dirs, not one (ObjectManager.cpp's own splitIncludeDirs()
# already handles this, built for -- and citing -- this exact real
# config).
mud_name: DeadSoulsNew
mudlib_root: temp/ds3.8.2_extracted/ds3.8.2/lib
master_file: /secure/daemon/master
simul_efun_file: /secure/sefun/sefun
include_dir: secure/include:include
global_include_file: <global.h>
dialect: fluffos
port: 4202
heartbeat_interval_ms: 2000
max_eval_cost: 5000000
max_string_length: 200000
