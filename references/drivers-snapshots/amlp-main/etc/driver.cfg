# amlp config -- boots this driver's own bundled mudlib (mudlib/,
# "library", a stripped-down rebuild of Lil bundled with the wand of
# creation, see mudlib/LIBRARY_MUDLIB_PLAN.md). The only driver config
# in the repo as of 2026-08-18 -- consolidated from two (this file used
# to point at test/mudlib_stub/, a minimal fixture mudlib, and a
# separate etc/driver_lil.cfg pointed at the real bundled mudlib; see
# STATUS.md for why). test/mudlib_stub/ itself is untouched on disk,
# just no longer referenced by any config file.
mud_name: Library
mudlib_root: mudlib
master_file: /single/master
simul_efun_file: /single/simul_efun
include_dir: include
global_include_file: <config.h>
port: 1122
heartbeat_interval_ms: 2000
max_eval_cost: 10000000
