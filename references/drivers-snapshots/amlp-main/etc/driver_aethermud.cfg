# amlp config -- boots the real, vendored third-party "AetherMUD" mudlib
# (temp/reference-lpc-mud-library, a Nightmare-3.2-lineage Rifts mudlib,
# gitignored, see CLAUDE.md) for row 3.9 verification. Values taken
# directly from that mudlib's own real bundled
# secure/cfg/mudos.cfg (a real driver-config template it ships), not
# guessed -- see ROADMAP.md row 3.9's own dated note for the full
# derivation, including why include_dir has no leading slash here
# despite the mudlib's own real-FluffOS-relative convention writing one
# (this driver's own splitIncludeDirs() rule treats a leading slash as
# truly filesystem-absolute, not mudlib-root-relative).
mud_name: AetherMUD
mudlib_root: temp/reference-lpc-mud-library
master_file: /secure/daemon/master
simul_efun_file: /secure/SimulEfun/SimulEfun
include_dir: secure/include:include
global_include_file: <global.h>
dialect: fluffos
port: 4200
heartbeat_interval_ms: 2000
max_eval_cost: 10000000
